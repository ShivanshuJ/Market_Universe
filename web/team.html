<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Z combinator · Market Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/universe.css">
<style>
body{overflow:auto;height:auto;min-height:100%}
.tp{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:70px 24px 90px}
.back{display:inline-block;color:var(--muted);text-decoration:none;font:700 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-bottom:46px}
.back:hover{color:var(--ink)}
.kick{font:600 12px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--accent2)}
.tp h1{font:700 clamp(54px,11vw,150px)/.92 var(--display);letter-spacing:-.05em;margin:12px 0 18px;background:linear-gradient(110deg,#fff 25%,var(--accent2) 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.tp .line{max-width:680px;color:#c4cae0;font-size:clamp(16px,2vw,20px);line-height:1.55;margin:0 0 54px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:20px;perspective:1500px}
.card{--rx:0deg;--ry:0deg;position:relative;border:1px solid var(--line);border-radius:26px;padding:26px 24px 24px;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s ease-out,border-color .3s;
  background:radial-gradient(circle at var(--gx,30%) var(--gy,0%),rgba(255,255,255,.12),transparent 55%),linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.012)),var(--card2);box-shadow:0 40px 70px -36px #000;animation:rise .7s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotateX(20deg)}}
.card:hover{border-color:rgba(255,255,255,.3)}
.av{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font:700 30px var(--display);color:#04050a;margin-bottom:18px;background:linear-gradient(130deg,var(--c1),var(--c2));box-shadow:0 14px 34px -12px var(--c1)}
.card h2{margin:0 0 4px;font:700 27px/1.1 var(--display);letter-spacing:-.025em}
.gh{display:inline-flex;align-items:center;gap:7px;color:var(--accent2);text-decoration:none;font:600 14px var(--mono);margin-bottom:18px}
.gh:hover{text-decoration:underline}
.f{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:9px 0;border-top:1px dashed var(--line);font-size:14px;align-items:baseline}
.f span{font:10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.f b{font-weight:500;font-size:13px;overflow-wrap:anywhere}
.foot{margin-top:54px;display:flex;gap:12px;flex-wrap:wrap}
.foot a{border:1px solid var(--line);border-radius:99px;padding:10px 20px;color:var(--ink);text-decoration:none;font:600 14px var(--display);background:rgba(255,255,255,.04);transition:all .2s}
.foot a:hover{border-color:var(--accent2);transform:translateY(-2px)}
@media(max-width:560px){.tp{padding-top:56px}}
</style>
</head>
<body>
<div class="sky"></div>
<main class="tp" id="main"></main>
<script src="/team.js"></script>
</body>
</html>
